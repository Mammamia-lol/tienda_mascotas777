<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión - Tienda de Mascotas 777</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f4f6f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
        }
        .btn-pet {
            background-color: #ff9f1c;
            border: none;
            color: white;
            font-weight: bold;
        }
        .btn-pet:hover {
            background-color: #e88d10;
            color: white;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <h2 style="color: #2b2d42; font-weight: bold;">🐾 Tienda 777</h2>
            <p class="text-muted">Ingresa tus credenciales para acceder</p>
        </div>

        <form id="loginForm">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold" style="color: #2b2d42;">Usuario</label>
                <input type="text" class="form-control" name="username" placeholder="Ej: mauro" required>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-bold" style="color: #2b2d42;">Contraseña</label>
                <input type="password" class="form-control" name="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-pet w-100 py-2 shadow-sm">
                🔑 Iniciar Sesión
            </button>
        </form>
    </div>

    <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault(); 
        
        const formData = new FormData(this);
        
        fetch("{% url 'login_sesion' %}", {
            method: "POST",
            body: formData
        })
        .then(response => {
            if (!response.ok) throw new Error("Credenciales incorrectas");
            return response.json();
        })
        .then(data => {
            if (data.token) {
                localStorage.setItem("token", data.token); 
                window.location.href = "{% url 'listar_mascotas' %}"; 
            }
        })
        .catch(error => {
            alert("Error: Usuario o contraseña incorrectos.");
            console.error(error);
        });
    });
    </script>

</body>
</html>
