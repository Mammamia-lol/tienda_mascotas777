<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eliminar Mascota - Tienda 777</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #f4f6f9; }
        .navbar-pet { background-color: #ff9f1c; }
        .navbar-brand { color: white !important; font-weight: bold; font-size: 1.5rem; }
        .panel-blanco {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-top: 30px;
        }
        
        .panel-peligro {
            border: 2px solid #dc3545; 
        }
    </style>
</head>
<body>

    
    <nav class="navbar navbar-pet mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{% url 'listar_mascotas' %}">🐾 Tienda de Mascotas 777</a>
        </div>
    </nav>

    
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="panel-blanco panel-peligro text-center">
                    
                    <h2 class="text-danger fw-bold mb-3">⚠️ ¿Eliminar Mascota?</h2>
                    
                    <p class="fs-5 mt-4">
                        ¿Estás seguro de que deseas eliminar a 
                        <strong class="text-dark">{{ mascota.nombre|title }}</strong> 
                        del inventario?
                    </p>
                    <p class="text-muted mb-4">Esta acción no se puede deshacer.</p>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="d-grid gap-3">
                            <button type="submit" class="btn btn-danger btn-lg shadow-sm">
                                🗑️ Sí, eliminar definitivamente
                            </button>
                            <a href="{% url 'listar_mascotas' %}" class="btn btn-secondary btn-lg shadow-sm">
                                ⬅️ Cancelar y Volver
                            </a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

</body>
</html>
